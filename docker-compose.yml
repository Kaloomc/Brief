# À coller dans Container Manager → Projet → Créer (voir docs/MISE-EN-LIGNE.md).
# Au démarrage : installe git et ffmpeg (la première fois) ; python3 seulement si VOIX_MOTEUR contient kokoro, et sans bloquer le démarrage s'il échoue, clone ou met à jour le dépôt GitHub, installe et lance le serveur.
# Pour déployer une nouvelle version : pousser sur GitHub, puis redémarrer le projet.
# Si la nouvelle version échoue aux tests (npm test), l'ancienne est remise et démarre à sa place.
# Au premier lancement, l'appli télécharge elle-même la voix française (Piper, environ 150 Mo) dans /docker/brief/app/data.
# Les fichiers audio (30 jours), les textes en cache et la progression d'écoute sont dans /docker/brief/app/data (jamais envoyés sur GitHub).
# Image Debian (et non Alpine) : Piper, la voix, a besoin de la bibliothèque glibc.
services:
  brief:
    image: node:20-bookworm-slim
    container_name: brief
    restart: unless-stopped
    ports:
      - "3014:3014"
    environment:
      - PORT=3014
      - TZ=Europe/Paris
      # OBLIGATOIRE : mot de passe demandé une fois sur chaque téléphone (il protège aussi les fichiers audio).
      # Vide = l'appli refuse d'écouter sur le réseau (elle sera injoignable).
      - APP_PASSWORD=
      # Mêmes valeurs que Repax, Agendix et Argenx : la base « Brief du matin » est dans la page Notion « Gestion »
      # (vide = mode démo : brief fictif, aucune connexion à Notion).
      - NOTION_TOKEN=
      - NOTION_PAGE_ID=
      # Adresse publique de l'appli : écrite dans « Audio (URL) » de chaque brief dans Notion.
      - URL_PUBLIQUE=https://teranga-nas.synology.me:8447
      # Widget iPhone (facultatif) : long jeton aléatoire (32 caractères au minimum) ; vide = widget désactivé.
      - WIDGET_TOKEN=
      # --- La voix (facultatif ; rien à régler pour la voix locale par défaut) ---
      # Moteur : piper (par défaut, local, léger), kokoro (local, plus lourd) ou azure (EN LIGNE, clé d'API : voir README, « La voix »).
      # Une liste donne l'ordre de repli : azure,piper = Azure, et Piper si Azure échoue.
      # - VOIX_MOTEUR=piper
      # Piper : voix fr_FR-upmc-medium (par défaut), fr_FR-siwis-medium, fr_FR-tom-medium, fr_FR-mls-medium, fr_FR-gilles-low ;
      # VOIX_LOCUTEUR : 1 = voix d'homme, 0 = voix de femme (pour upmc).
      # - VOIX_MODELE=fr_FR-upmc-medium
      # - VOIX_LOCUTEUR=1
      # Azure (seulement avec VOIX_MOTEUR=azure) : le texte des chapitres part chez Microsoft. Jamais la clé dans GitHub.
      # - AZURE_SPEECH_KEY=
      # - AZURE_SPEECH_REGION=francecentral
      # - AZURE_VOIX=fr-FR-VivienneMultilingualNeural
      # Plus enjouée (facultatif, à essayer) : AZURE_HAUTEUR=+3% et AZURE_VITESSE=1.05 ; AZURE_STYLE=cheerful (seulement si la voix choisie le gère, par exemple fr-FR-DeniseNeural).
      # - AZURE_HAUTEUR=+3%
      # - AZURE_VITESSE=1.05
    volumes:
      - ./app:/app
    working_dir: /app
    command: >
      sh -c "(command -v git >/dev/null && command -v ffmpeg >/dev/null ||
              (apt-get update && apt-get install -y --no-install-recommends git ffmpeg ca-certificates && apt-get clean)) &&
             case x$$VOIX_MOTEUR in *kokoro*) command -v python3 >/dev/null || (apt-get update && apt-get install -y --no-install-recommends python3 python3-venv && apt-get clean) || true;; esac &&
             git config --global --add safe.directory /app &&
             if [ -d /app/.git ]; then
               AVANT=$$(git rev-parse HEAD);
               git fetch --depth 1 origin main && git reset --hard FETCH_HEAD;
               if ! (npm ci --omit=dev && NOTION_TOKEN= npm test); then
                 echo 'Nouvelle version en echec aux tests : retour a la precedente';
                 git reset --hard $$AVANT && npm ci --omit=dev;
               fi;
             else
               git clone --depth 1 https://github.com/Kaloomc/Brief.git /app && npm ci --omit=dev;
             fi &&
             npm start"
